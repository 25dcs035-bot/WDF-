<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <title>Feedback - Student Hub Portal</title> 
    <style> 
        body { 
            background-color: #eef2f6;
              font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
        } 
 
        .main-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 40px 20px; 
        } 
 
        
        .feedback-card { 
            background-color: #ffffff; 
            border: 2px solid #333333; 
            width: 100%; 
            max-width: 500px; 
            padding: 30px 40px; 
            box-sizing: border-box; 
        } 
 
        .page-title { 
            text-align: center; 
            font-size: 22px; 
            font-weight: normal; 
            margin-bottom: 25px; 
            color: #222222;
              } 
 
        .form-group { 
            margin-bottom: 20px; 
            text-align: left; 
        } 
 
        .form-group label { 
            display: block; 
            font-size: 16px; 
            margin-bottom: 8px; 
            color: #333333; 
        } 
 
        .form-group select, 
        .form-group textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1.5px solid #444444; 
            font-size: 14px; 
            box-sizing: border-box; 
            background-color: #ffffff; 
            outline: none; 
        } 
 
        .form-group textarea { 
            height: 90px; 
            resize: vertical; 
 } 
        .btn-submit { 
            width: 100%; 
            background-color: #4a4a4a; 
            color: #ffffff; 
            padding: 12px; 
            border: none; 
            font-size: 15px; 
            cursor: pointer; 
            margin-top: 5px; 
        } 
 
        .btn-submit:hover { 
            background-color: #222222; 
        } 
    </style> 
</head> 
<body> 
 
    <table width="100%" border="0" cellpadding="20" cellspacing="0"> 
        <tr> 
            <td align="left" valign="middle" nowrap> 
                <img src="logo.jpg" alt="Student Hub Logo" width="60" height="60" 
align="middle"> 
                <strong><font size="6">Student Hub Portal</font></strong> 
            </td> 
 
            <td align="right" valign="middle"> 
<a href="Dashboard.html">Dashboard</a>  
                <a href="Events.html">Events</a>  
                <a href="Contact.html">Contact</a>  
                <a href="About.html">About</a> 
                <a href="home.html">home</a> 
            </td> 
        </tr> 
    </table> 
 
    <hr> 
 
    <div class="main-container"> 
        <div class="feedback-card"> 
             
            <h2 class="page-title">Feedback & Suggestions</h2> 
 
            <form action="#" method="POST"> 
                <div class="form-group"> 
                    <label for="category">Category</label> 
                    <select id="category" name="category"> 
                        <option value="">select catagory</option> 
                        <option value="general">General Feedback</option> 
                        <option value="bug">Report an Issue</option> 
                        <option value="academic">Academics</option> 
                    </select> 
                </div> 
 
                <div class="form-group">
                     <label for="rating">Rating</label> 
                    <select id="rating" name="rating"> 
                        <option value="">rating star</option> 
                        <option value="5">5 Stars</option> 
                        <option value="4">4 Stars</option> 
                        <option value="3">3 Stars</option> 
                        <option value="2">2 Stars</option> 
                        <option value="1">1 Star</option> 
                    </select> 
                </div> 
 
                <div class="form-group"> 
                    <label for="feedback">Your Feedback</label> 
                    <textarea id="feedback" name="feedback"></textarea> 
                </div> 
 
                <button type="submit" class="btn-submit">Submit Feedback</button> 
            </form> 
 
        </div> 
    </div> 
 
</body> 
</html>
